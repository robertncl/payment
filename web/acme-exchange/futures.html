<script>
// Screen logic and markup ported from the ACME Exchange design canvas (Futures.dc.html).
var NAV = [
  { label: 'Markets', href: 'index.html' },
  { label: 'Spot', href: 'trade.html' },
  { label: 'Futures', href: 'futures.html' },
  { label: 'Earn', href: 'earn.html' },
  { label: 'Wallet', href: 'wallet.html' }
];
var LAST = 95141.8, MARK = 95139.6, AVAIL = 7412.38, MMR = 0.005, TAKER = 0.0006;
var LEVS = [1, 2, 3, 5, 10, 20, 25, 50, 75, 100];
var INTERVALS = [
  { id: '1m', label: '1m', min: 1 }, { id: '5m', label: '5m', min: 5 }, { id: '15m', label: '15m', min: 15 },
  { id: '1h', label: '1h', min: 60 }, { id: '4h', label: '4h', min: 240 }, { id: '1D', label: '1D', min: 1440 }
];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var NOW = Date.UTC(2026, 9, 17, 14, 30);
var UP = 'var(--acme-color-text)', DOWN = 'var(--acme-color-text)';

function rng(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function signed(n, dp) { return (n >= 0 ? '+' : '−') + fmt(Math.abs(n), dp); }
function num(s) { var n = parseFloat(String(s).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function hms(t) { return pad2(Math.floor(t / 3600) % 24) + ':' + pad2(Math.floor(t / 60) % 60) + ':' + pad2(t % 60); }
function genCandles(seed, n, last, vol) {
  var r = rng(seed), closes = [], v = 0, i;
  for (i = 0; i < n; i++) { v += (r() - 0.47) * vol; closes.push(v); }
  var shift = last - closes[n - 1], prev = closes[0] + shift - vol * 0.3, out = [];
  for (i = 0; i < n; i++) {
    var c = closes[i] + shift, o = prev;
    out.push({ o: o, c: c, h: Math.max(o, c) + r() * vol * 0.6, l: Math.min(o, c) - r() * vol * 0.6, v: 0.25 + r() * 0.75 + Math.abs(c - o) / vol * 0.4 });
    prev = c;
  }
  return out;
}
function niceStep(range, count) {
  var rough = range / count, mag = Math.pow(10, Math.floor(Math.log10(rough))), steps = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < steps.length; i++) { if (steps[i] * mag >= rough) return steps[i] * mag; }
  return 10 * mag;
}
var BOOK = (function () {
  var r = rng(211), asks = [], bids = [], ca = 0, cb = 0, a = 95142.3, b = 95141.3, i;
  for (i = 0; i < 10; i++) { var qa = 0.005 + r() * 0.8; ca += qa; asks.push({ p: a, q: qa, cum: ca }); a += 1 + Math.round(r() * 60) / 10; }
  for (i = 0; i < 10; i++) { var qb = 0.005 + r() * 0.8; cb += qb; bids.push({ p: b, q: qb, cum: cb }); b -= 1 + Math.round(r() * 60) / 10; }
  return { asks: asks, bids: bids, max: Math.max(ca, cb) };
})();
var TRADES = (function () {
  var r = rng(307), out = [], t = 14 * 3600 + 32 * 60 + 9, p = LAST;
  for (var i = 0; i < 10; i++) {
    var up = i === 0 ? true : r() > 0.45;
    out.push({ price: fmt(p, 1), amount: fmt(0.001 + Math.round(r() * 400) / 1000, 3), time: hms(t), color: up ? UP : DOWN });
    p += Math.round((r() - 0.5) * 90) / 10; t -= 1 + Math.floor(r() * 7);
  }
  return out;
})();
var POSITION = { market: 'BTC-PERP', side: 'long', lev: 10, size: 0.1, entry: 94205.3 };
var OPEN = [{ id: 'p1', time: '14:05:51', side: 'sell', type: 'Limit', price: 96500, qty: 0.05, lev: 10 }];
var HISTORY = [
  { time: '13:12:40', side: 'buy', type: 'Market', price: 94205.3, qty: 0.1, pnl: null, status: 'Filled' },
  { time: '10:48:02', side: 'sell', type: 'Limit', price: 95020.0, qty: 0.05, pnl: 61.85, status: 'Filled' },
  { time: '08:30:15', side: 'buy', type: 'Limit', price: 93783.0, qty: 0.05, pnl: null, status: 'Filled' }
];

class Component extends DCLogic {
  state = { interval: '15m', posTab: 'positions', side: 'long', lev: 10, orderType: 'limit', price: '95,141.8', qty: '', qtyError: '', placed: '', positions: [POSITION], open: OPEN, history: HISTORY, confirmOpen: false, closed: '', seq: 0 };

  submit() {
    var s = this.state, q = num(s.qty), isMarket = s.orderType === 'market', px = isMarket ? LAST : num(s.price);
    if (q <= 0) { this.setState({ qtyError: 'Enter a quantity in BTC. The minimum order value is 5 USDT.', placed: '' }); return; }
    var margin = px * q / s.lev;
    if (margin > AVAIL) { this.setState({ qtyError: 'Not enough margin: this needs ' + fmt(margin, 2) + ' USDT. Lower the quantity or raise leverage.', placed: '' }); return; }
    var verb = s.side === 'long' ? 'Long' : 'Short', seq = s.seq + 1, time = hms(14 * 3600 + 32 * 60 + 12 + seq * 3);
    if (isMarket) {
      this.setState({ qty: '', qtyError: '', seq: seq, history: [{ time: time, side: s.side === 'long' ? 'buy' : 'sell', type: 'Market', price: LAST, qty: q, pnl: null, status: 'Filled' }].concat(s.history),
        placed: verb + ' ' + fmt(q, 3) + ' BTC at ' + s.lev + '× filled at market.' });
    } else {
      this.setState({ qty: '', qtyError: '', seq: seq, posTab: 'open', open: [{ id: 'n' + seq, time: time, side: s.side === 'long' ? 'buy' : 'sell', type: 'Limit', price: px, qty: q, lev: s.lev }].concat(s.open),
        placed: verb + ' ' + fmt(q, 3) + ' BTC at ' + fmt(px, 1) + ', ' + s.lev + '×, is open.' });
    }
  }

  renderVals() {
    var self = this, s = this.state;
    var mono = (this.props.candles || 'directional') === 'monochrome';

    var iv = INTERVALS.filter(function (x) { return x.id === s.interval; })[0] || INTERVALS[2];
    var ivIndex = INTERVALS.indexOf(iv), n = 64, vol = 120 * Math.sqrt(iv.min / 15);
    var cs = genCandles(71 + ivIndex * 19, n, LAST, vol);
    var lo = Infinity, hi = -Infinity, vmax = 0;
    cs.forEach(function (c) { lo = Math.min(lo, c.l); hi = Math.max(hi, c.h); vmax = Math.max(vmax, c.v); });
    lo = Math.min(lo, POSITION.entry);
    var pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    function y(p) { return (hi - p) / (hi - lo) * 100; }
    var candles = cs.map(function (c) {
      var up = c.c >= c.o, color = mono ? 'var(--acme-color-data)' : (up ? UP : DOWN), top = y(Math.max(c.o, c.c));
      return { wickTop: y(c.h).toFixed(2), wickH: (y(c.l) - y(c.h)).toFixed(2), bodyTop: top.toFixed(2),
        bodyH: Math.max(0.4, y(Math.min(c.o, c.c)) - top).toFixed(2), stroke: color,
        fill: up ? 'var(--acme-color-surface-raised)' : color, volH: (c.v / vmax * 100).toFixed(1) };
    });
    var step = niceStep(hi - lo, 5), ticks = [];
    for (var p = Math.ceil(lo / step) * step; p <= hi; p += step) {
      var tt = y(p);
      if (tt > 4 && tt < 96) ticks.push({ top: tt.toFixed(2), label: fmt(p, step < 1 ? 1 : 0) });
    }
    var timeLabels = [];
    for (var k = 4; k < n; k += 15) {
      var d = new Date(NOW - (n - 1 - k) * iv.min * 60000);
      timeLabels.push({ label: iv.min >= 1440 ? MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate() : pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) });
    }
    var lc = cs[n - 1];

    function bookRow(r, kind) {
      return { price: fmt(r.p, 1), qty: fmt(r.q, 3), cum: fmt(r.cum, 3), depth: (r.cum / BOOK.max * 100).toFixed(1),
        label: 'Use ' + kind + ' price ' + fmt(r.p, 1),
        pick: function () { self.setState({ price: fmt(r.p, 1), orderType: 'limit', qtyError: '' }); } };
    }

    var positions = s.positions.map(function (ps) {
      var pnl = (MARK - ps.entry) * ps.size * (ps.side === 'long' ? 1 : -1), margin = ps.entry * ps.size / ps.lev;
      var liq = ps.side === 'long' ? ps.entry * (1 - 1 / ps.lev + MMR) : ps.entry * (1 + 1 / ps.lev - MMR);
      return { market: ps.market, sideLabel: (ps.side === 'long' ? 'Long ' : 'Short ') + ps.lev + '×', sideColor: ps.side === 'long' ? UP : DOWN,
        size: fmt(ps.size, 3), entry: fmt(ps.entry, 1), mark: fmt(MARK, 1), liq: fmt(liq, 1), margin: fmt(margin, 2),
        pnl: signed(pnl, 2) + ' (' + signed(pnl / margin * 100, 2) + '%)', pnlColor: ps.side === 'long' ? UP : DOWN,
        closeLabel: 'Close ' + ps.market + ' ' + ps.side + ' position',
        close: function () { self.setState({ confirmOpen: true }); } };
    });
    var cur = s.positions[0];
    var curPnl = cur ? (MARK - cur.entry) * cur.size * (cur.side === 'long' ? 1 : -1) : 0;
    var curMargin = cur ? cur.entry * cur.size / cur.lev : 0;
    var orderMargin = s.open.reduce(function (sum, o) { return sum + o.price * o.qty / o.lev; }, 0);

    var openRows = s.open.map(function (o) {
      return { time: o.time, sideLabel: o.side === 'buy' ? 'Long' : 'Short', sideColor: o.side === 'buy' ? UP : DOWN, type: o.type,
        price: fmt(o.price, 1), qty: fmt(o.qty, 3), lev: o.lev + '×',
        cancelLabel: 'Cancel order at ' + fmt(o.price, 1),
        cancel: function () { self.setState({ open: self.state.open.filter(function (x) { return x.id !== o.id; }),
          history: [{ time: o.time, side: o.side, type: o.type, price: o.price, qty: o.qty, pnl: null, status: 'Cancelled' }].concat(self.state.history) }); } };
    });
    var historyRows = s.history.map(function (o) {
      return { time: o.time, sideLabel: o.side === 'buy' ? 'Buy' : 'Sell', sideColor: o.side === 'buy' ? UP : DOWN, type: o.type,
        price: fmt(o.price, 1), qty: fmt(o.qty, 3), pnl: o.pnl === null ? '—' : signed(o.pnl, 2),
        pnlColor: o.pnl === null ? 'var(--acme-color-text-muted)' : (o.side === 'buy' ? UP : DOWN),
        status: o.status, badge: o.status === 'Filled' ? 'success' : 'neutral' };
    });

    var isLong = s.side === 'long', isMarket = s.orderType === 'market';
    var px = isMarket ? LAST : num(s.price), q = num(s.qty), value = px * q;
    var liqNew = isLong ? px * (1 - 1 / s.lev + MMR) : px * (1 + 1 / s.lev - MMR);
    function seg(active, color) {
      return active ? { border: 'var(--acme-color-selected)', bg: 'var(--acme-color-selected-soft)', shadow: 'var(--acme-shadow-sm)', ink: 'var(--acme-color-selected)' }
        : { border: 'transparent', bg: 'transparent', shadow: 'none', ink: 'var(--acme-color-text-muted)' };
    }
    var ls = seg(isLong, UP), ss = seg(!isLong, DOWN);
    var levs = LEVS.map(function (l) {
      var on = l === s.lev;
      return { label: l + '×', pressed: on ? 'true' : 'false',
        border: on ? 'var(--acme-color-selected)' : 'var(--acme-color-border)',
        bg: on ? 'var(--acme-color-selected-soft)' : 'var(--acme-color-surface-raised)',
        ink: on ? 'var(--acme-color-selected)' : 'var(--acme-color-text-muted)',
        pick: function () { self.setState({ lev: l, qtyError: '' }); } };
    });
    var pcts = [25, 50, 75, 100].map(function (pc) {
      return { label: pc === 100 ? 'Max' : pc + '%', aria: 'Use ' + pc + '% of available margin',
        pick: function () {
          var qq = px > 0 ? AVAIL * (pc / 100) * s.lev / (px * (1 + TAKER * s.lev)) : 0;
          self.setState({ qty: (Math.floor(qq * 1000) / 1000).toFixed(3), qtyError: '' });
        } };
    });

    return {
      navLinks: NAV, no: false,

      intervals: INTERVALS.map(function (x) { return { id: x.id, label: x.label }; }),
      interval: iv.id,
      setInterval: function (id) { self.setState({ interval: id }); },
      intervalPanelId: 'interval-panel-' + iv.id, intervalTabId: 'interval-tab-' + iv.id,
      chartLabel: 'BTC-PERP ' + iv.label + ' candlestick chart, last price ' + fmt(LAST, 1) + ', your entry ' + fmt(POSITION.entry, 1),
      ohlc: 'O ' + fmt(lc.o, 1) + '  H ' + fmt(lc.h, 1) + '  L ' + fmt(lc.l, 1) + '  C ' + fmt(lc.c, 1),
      candles: candles, ticks: ticks, timeLabels: timeLabels,
      lastTop: y(LAST).toFixed(2), lastLabel: fmt(LAST, 1), entryTop: y(POSITION.entry).toFixed(2),

      asks: BOOK.asks.slice().reverse().map(function (r) { return bookRow(r, 'ask'); }),
      bids: BOOK.bids.map(function (r) { return bookRow(r, 'bid'); }),
      trades: TRADES,

      posTabs: [{ id: 'positions', label: 'Positions', count: s.positions.length }, { id: 'open', label: 'Orders', count: s.open.length }, { id: 'history', label: 'History' }],
      posTab: s.posTab,
      setPosTab: function (id) { self.setState({ posTab: id }); },
      posPanelId: 'pos-panel-' + s.posTab, posTabId: 'pos-tab-' + s.posTab,
      showPositions: s.posTab === 'positions', showOpen: s.posTab === 'open', showHistory: s.posTab === 'history',
      positions: positions, noPositions: positions.length === 0,
      openRows: openRows, noOpen: openRows.length === 0, historyRows: historyRows,
      hasClosed: !!s.closed, closedText: s.closed,

      confirmOpen: s.confirmOpen,
      confirmTitle: 'Close your BTC-PERP long?',
      confirmBody: cur ? 'This sells ' + fmt(cur.size, 3) + ' BTC at market, near ' + fmt(MARK, 1) + '. About ' + signed(curPnl, 2) + ' USDT of profit and ' + fmt(curMargin, 2) + ' USDT of margin return to your balance.' : '',
      confirmCta: cur ? 'Close ' + fmt(cur.size, 3) + ' BTC at market' : 'Close position',
      keepPosition: function () { self.setState({ confirmOpen: false }); },
      confirmClose: function () {
        self.setState({ confirmOpen: false, positions: [],
          history: [{ time: '14:32:20', side: 'sell', type: 'Market', price: MARK, qty: cur.size, pnl: curPnl, status: 'Filled' }].concat(self.state.history),
          closed: 'Sold ' + fmt(cur.size, 3) + ' BTC at ' + fmt(MARK, 1) + '. ' + signed(curPnl, 2) + ' USDT realized.' });
      },

      pickLong: function () { self.setState({ side: 'long', qtyError: '', placed: '' }); },
      pickShort: function () { self.setState({ side: 'short', qtyError: '', placed: '' }); },
      longPressed: isLong ? 'true' : 'false', shortPressed: isLong ? 'false' : 'true',
      longBorder: ls.border, longBg: ls.bg, longShadow: ls.shadow, longInk: ls.ink,
      shortBorder: ss.border, shortBg: ss.bg, shortShadow: ss.shadow, shortInk: ss.ink,
      levs: levs, levLabel: s.lev + '×',
      typeTabs: [{ id: 'limit', label: 'Limit' }, { id: 'market', label: 'Market' }],
      orderType: s.orderType,
      setOrderType: function (id) { self.setState({ orderType: id, qtyError: '' }); },
      typePanelId: 'otype-panel-' + s.orderType, typeTabId: 'otype-tab-' + s.orderType,
      isMarket: isMarket,
      priceValue: isMarket ? '' : s.price,
      pricePlaceholder: isMarket ? 'Best available price' : '0.0',
      priceHelp: isMarket ? 'Fills now at the best price in the book.' : '',
      onPrice: function (e) { self.setState({ price: e.target.value }); },
      qty: s.qty, qtyError: s.qtyError,
      onQty: function (e) { self.setState({ qty: e.target.value, qtyError: '' }); },
      pcts: pcts,
      valueLabel: q > 0 ? fmt(value, 2) + ' USDT' : '—',
      marginLabel: q > 0 ? fmt(value / s.lev, 2) + ' USDT' : '—',
      liqLabel: q > 0 ? fmt(liqNew, 1) : '—',
      feeLabel: q > 0 ? fmt(value * TAKER, 4) + ' USDT' : '—',
      formSide: isLong ? 'long' : 'short',
      submitVariant: 'primary',
      levInk: 'var(--acme-color-text)',
      submitLabel: 'Long ' + (q > 0 ? fmt(q, 3) + ' BTC' : 'BTC') + ' at ' + s.lev + '×',
      onSubmit: function (e) { e.preventDefault(); self.submit(); },
      hasPlaced: !!s.placed, placedText: s.placed,

      posMarginLabel: fmt(curMargin, 2) + ' USDT',
      orderMarginLabel: fmt(orderMargin, 2) + ' USDT',
      upnlLabel: signed(curPnl, 2) + ' USDT',
      closeVariant: 'primary',
      acctColor: 'var(--acme-color-text)',
      acctLabelColor: 'var(--acme-color-text-muted)',
      upnlColor: !cur ? 'var(--acme-color-text-muted)' : (cur.side === 'long' ? UP : DOWN)
    };
  }
}
