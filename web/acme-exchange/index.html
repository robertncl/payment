<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markets · ACME Exchange</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles/modernist-tokens.css">
<link rel="stylesheet" href="styles/acme-modernist.css">
<style>
body{margin:0}
a{color:var(--blue)}a:hover{color:var(--blue-hover)}
a.acme-btn{text-decoration:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="ds/components/bundle.js"></script>
<script src="js/runtime.js"></script>
</head>
<body>
<div id="root"></div>
<script>
// Screen logic and markup ported from the ACME Exchange design canvas (Main.dc.html).
var NAV = [
  { label: 'Markets', href: 'index.html' },
  { label: 'Spot', href: 'trade.html' },
  { label: 'Futures', href: 'futures.html' },
  { label: 'Earn', href: 'earn.html' },
  { label: 'Wallet', href: 'wallet.html' }
];
var SPOT = [
  { base: 'BTC', name: 'Bitcoin', last: '95,128.40', pct: 1.84, high: '95,610.00', low: '92,874.15', volume: '182.4M USDT', seed: 11 },
  { base: 'ETH', name: 'Ethereum', last: '3,512.86', pct: -0.72, high: '3,561.20', low: '3,468.05', volume: '96.1M USDT', seed: 23 },
  { base: 'SOL', name: 'Solana', last: '181.245', pct: 3.96, high: '183.900', low: '172.410', volume: '41.7M USDT', seed: 37 },
  { base: 'BNB', name: 'BNB', last: '601.37', pct: -0.18, high: '606.90', low: '597.12', volume: '18.3M USDT', seed: 41 }
];
var PERPS = [
  { symbol: 'BTC-PERP', base: 'BTC', last: '95,141.8', pct: 1.91, mark: '95,139.6', index: '95,128.40', funding: 0.0100, maxLev: 100 },
  { symbol: 'ETH-PERP', base: 'ETH', last: '3,513.42', pct: -0.69, mark: '3,513.10', index: '3,512.86', funding: -0.0042, maxLev: 100 },
  { symbol: 'SOL-PERP', base: 'SOL', last: '181.262', pct: 4.02, mark: '181.250', index: '181.245', funding: 0.0185, maxLev: 50 }
];
function rng(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function spark(seed, up) {
  var r = rng(seed), pts = [], v = 50;
  for (var i = 0; i < 24; i++) { v += (r() - 0.5) * 9 + (up ? 0.8 : -0.8); pts.push(v); }
  var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  return pts.map(function (p, i) { return (i * 96 / 23).toFixed(1) + ',' + (25 - (p - min) / ((max - min) || 1) * 22).toFixed(1); }).join(' ');
}
function pct(n) { return (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(2) + '%'; }
class Component extends DCLogic {
  state = { q: '' };
  renderVals() {
    var self = this;
    var q = this.state.q.trim().toLowerCase();
    var spotRows = SPOT.filter(function (m) { return !q || (m.base + '/usdt ' + m.name).toLowerCase().indexOf(q) >= 0; }).map(function (m) {
      var up = m.pct >= 0;
      return { base: m.base, name: m.name, initial: m.base.charAt(0), last: m.last, high: m.high, low: m.low, volume: m.volume,
        change: pct(m.pct), up: up, down: !up, dirColor: 'var(--acme-color-text)',
        spark: spark(m.seed, up), tradeLabel: 'Trade ' + m.base + '/USDT' };
    });
    var perpRows = PERPS.filter(function (m) { return !q || m.symbol.toLowerCase().indexOf(q) >= 0; }).map(function (m) {
      var up = m.pct >= 0;
      return { symbol: m.symbol, initial: m.base.charAt(0), last: m.last, mark: m.mark, index: m.index,
        change: pct(m.pct), up: up, down: !up, dirColor: 'var(--acme-color-text)',
        funding: (m.funding >= 0 ? '+' : '−') + Math.abs(m.funding).toFixed(4) + '%',
        fundColor: 'var(--acme-color-text)',
        maxLev: m.maxLev + '×', tradeLabel: 'Trade ' + m.symbol };
    });
    return {
      navLinks: NAV,
      q: this.state.q,
      onSearch: function (e) { self.setState({ q: e.target.value }); },
      spotRows: spotRows,
      perpRows: perpRows,
      noSpot: spotRows.length === 0,
      noPerp: perpRows.length === 0,
      spotCountLabel: spotRows.length + (spotRows.length === 1 ? ' pair' : ' pairs') + ', quoted in USDT',
      perpCountLabel: perpRows.length + (perpRows.length === 1 ? ' contract' : ' contracts')
    };
  }
}

function template(v) {
return html`<div style="min-height: 100vh; background: var(--acme-color-canvas); color: var(--acme-color-text); font-family: var(--acme-font-sans); font-size: 14px; line-height: 1.5;">
<${DS.Topbar} links=${v.navLinks} current="Markets">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
<${DS.Badge} variant="warning">Unverified<//>
<span style="color: var(--acme-color-text-muted);">trader@example.com</span>
<a class="acme-btn acme-btn--ghost acme-btn--sm" href="sign-in.html">Sign out</a>
</div>
<//>

<main style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; gap: 48px;">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between;">
<div style="flex: 1 1 420px; min-width: 0;">
<p style="margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--acme-color-text-muted);">ACME Exchange</p>
<h1 style="margin: 0 0 8px; font-family: var(--acme-font-sans); font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; text-wrap: balance;">Markets</h1>
<p style="margin: 0; max-width: 60ch; font-size: 16px; color: var(--acme-color-text-muted);">Spot pairs and perpetual contracts, priced live by the matching engine.</p>
</div>
<div style="flex: 0 1 320px; min-width: 240px;">
<${DS.Field} label="Search markets" html-for="market-search"><${DS.Input} id="market-search" type="search" placeholder="BTC, ETH, SOL" value=${v.q} on-change=${v.onSearch}><//><//>
</div>
</div>

<section aria-labelledby="spot-heading" style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;">
<h2 id="spot-heading" style="margin: 0; font-family: var(--acme-font-sans); font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em;">Spot</h2>
<span style="color: var(--acme-color-text-muted);">${v.spotCountLabel}</span>
</div>
<div style="background: var(--acme-color-surface-raised); border-top: 2px solid var(--acme-color-text); overflow-x: auto;">
<div style="min-width: 920px; padding: 4px 8px;">
<${DS.Table} caption="Spot markets">
<thead>
<tr>
<th scope="col">Pair</th>
<th scope="col" class="acme-table__num">Last price</th>
<th scope="col" class="acme-table__num">24h change</th>
<th scope="col">24h trend</th>
<th scope="col" class="acme-table__num">24h high</th>
<th scope="col" class="acme-table__num">24h low</th>
<th scope="col" class="acme-table__num">24h volume</th>
<th scope="col"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">Actions</span></th>
</tr>
</thead>
<tbody>
${(v.spotRows || []).map((m) => html`
<tr>
<td>
<div style="display: flex; align-items: center; gap: 12px;">
<span aria-hidden="true" style="display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: var(--acme-radius-md); border: 1px solid var(--acme-color-border); background: var(--acme-color-surface); font-weight: 700; font-size: 13px;">${m.initial}</span>
<span style="display: flex; flex-direction: column; line-height: 1.3;">
<span><strong style="font-weight: 600;">${m.base}</strong><span style="color: var(--acme-color-text-subtle);">/USDT</span></span>
<span style="font-size: 12px; color: var(--acme-color-text-muted);">${m.name}</span>
</span>
</div>
</td>
<td class="acme-table__num" style="font-weight: 600;">${m.last}</td>
<td class="acme-table__num">
<span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: ${m.dirColor};">
${m.up ? html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>` : null}
${m.down ? html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10"/><path d="M17 7v10H7"/></svg>` : null}
${m.change}
</span>
</td>
<td><svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true" style="display: block;"><polyline points=${m.spark} fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" style="stroke: var(--acme-color-data);"/></svg></td>
<td class="acme-table__num" style="color: var(--acme-color-text-muted);">${m.high}</td>
<td class="acme-table__num" style="color: var(--acme-color-text-muted);">${m.low}</td>
<td class="acme-table__num" style="color: var(--acme-color-text-muted);">${m.volume}</td>
<td class="acme-table__num"><a class="acme-btn acme-btn--secondary acme-btn--sm" href="trade.html" aria-label=${m.tradeLabel}>Trade</a></td>
</tr>
`)}
</tbody>
<//>
${v.noSpot ? html`
<p style="margin: 0; padding: 24px 12px; color: var(--acme-color-text-muted);">No spot pairs match “${v.q}”. Try a symbol like BTC.</p>
` : null}
</div>
</div>
</section>

<section aria-labelledby="perp-heading" style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;">
<h2 id="perp-heading" style="margin: 0; font-family: var(--acme-font-sans); font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em;">Perpetual futures</h2>
<span style="color: var(--acme-color-text-muted);">${v.perpCountLabel}</span>
<${DS.Badge} variant="warning">Leverage up to 100×<//>
</div>
<div style="background: var(--acme-color-surface-raised); border-top: 2px solid var(--acme-color-text); overflow-x: auto;">
<div style="min-width: 920px; padding: 4px 8px;">
<${DS.Table} caption="Perpetual futures markets">
<thead>
<tr>
<th scope="col">Contract</th>
<th scope="col" class="acme-table__num">Last price</th>
<th scope="col" class="acme-table__num">24h change</th>
<th scope="col" class="acme-table__num">Mark price</th>
<th scope="col" class="acme-table__num">Index price</th>
<th scope="col" class="acme-table__num">Funding rate</th>
<th scope="col" class="acme-table__num">Max leverage</th>
<th scope="col"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">Actions</span></th>
</tr>
</thead>
<tbody>
${(v.perpRows || []).map((m) => html`
<tr>
<td>
<div style="display: flex; align-items: center; gap: 12px;">
<span aria-hidden="true" style="display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: var(--acme-radius-md); border: 1px solid var(--acme-color-border); background: var(--acme-color-surface); font-weight: 700; font-size: 13px;">${m.initial}</span>
<span style="display: flex; flex-direction: column; line-height: 1.3;">
<strong style="font-weight: 600;">${m.symbol}</strong>
<span style="font-size: 12px; color: var(--acme-color-text-muted);">USDT-margined · isolated</span>
</span>
</div>
</td>
<td class="acme-table__num" style="font-weight: 600;">${m.last}</td>
<td class="acme-table__num">
<span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: ${m.dirColor};">
${m.up ? html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>` : null}
${m.down ? html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10"/><path d="M17 7v10H7"/></svg>` : null}
${m.change}
</span>
</td>
<td class="acme-table__num">${m.mark}</td>
<td class="acme-table__num" style="color: var(--acme-color-text-muted);">${m.index}</td>
<td class="acme-table__num" style="color: ${m.fundColor};">${m.funding}</td>
<td class="acme-table__num">${m.maxLev}</td>
<td class="acme-table__num"><a class="acme-btn acme-btn--secondary acme-btn--sm" href="futures.html" aria-label=${m.tradeLabel}>Trade</a></td>
</tr>
`)}
</tbody>
<//>
${v.noPerp ? html`
<p style="margin: 0; padding: 24px 12px; color: var(--acme-color-text-muted);">No contracts match “${v.q}”.</p>
` : null}
</div>
</div>
</section>

<p style="margin: 0; font-size: 12px; color: var(--acme-color-text-subtle);">Prices update in real time. ACME Exchange is a simulated custody demo: balances are not real funds.</p>
</main>
</div>`;
}

mount(Component, template, {});
</script>
</body>
</html>
